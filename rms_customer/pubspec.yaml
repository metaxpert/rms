name: rms_customer
description: "MetaXperts RMS — Customer app. Browse the menu, order, follow it to the door."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared foundation for all four RMS apps: API client with token refresh,
  # session, money, theme, domain models, the catalogue, the sign-in journey.
  rms_core:
    path: ../packages/rms_core

  http: ^1.2.0
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^11.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  cupertino_icons: ^1.0.6

  # The live delivery map. OpenStreetMap tiles through flutter_map rather than
  # google_maps_flutter: no API key, no billing account and no native config to
  # keep in step across two platforms, which matters for an app a restaurant
  # builds itself. It is also a plain Flutter widget layer, so the map themes with
  # the design system and honours dark mode instead of being an opaque platform
  # view sitting on top of it.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
