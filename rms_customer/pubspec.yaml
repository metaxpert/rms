name: rms_customer
description: "MetaXperts RMS — Customer app. Browse the menu, order, follow it to the door."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared foundation for all four RMS apps: API client with token refresh,
  # session, money, theme, domain models, the catalogue, the sign-in journey.
  rms_core:
    path: ../packages/rms_core

  http: ^1.2.0
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^11.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
