name: rms_waiter
description: "MetaXperts RMS — Waiter app. Take orders, fire to the kitchen, settle bills."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared foundation for all four RMS apps: API client with token refresh,
  # session, money, theme, domain models. See packages/rms_core.
  rms_core:
    path: ../packages/rms_core

  # Lightweight HTTP — chosen over dio to keep the APK small for low-end
  # Tecno/Infinix devices common in Pakistani restaurants.
  http: ^1.2.0

  # Money/date formatting.
  intl: ">=0.19.0 <0.21.0"

  # Persist the auth token + API base between launches.
  shared_preferences: ^2.2.0

  cupertino_icons: ^1.0.6

  # Buzzes the tablet when the kitchen calls food away and the waiter is not
  # looking at the app. Isolated behind a conditional import (see
  # features/notifications) because it has no web implementation.
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
