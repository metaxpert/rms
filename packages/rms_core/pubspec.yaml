name: rms_core
description: Shared foundation for the MetaXperts RMS apps — API client, session, money, theme, domain models.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Lightweight HTTP — kept over dio so the four APKs stay small for the
  # low-end Tecno/Infinix devices common in Pakistani restaurants.
  http: ^1.2.0
  intl: ">=0.19.0 <0.21.0"

  # Non-sensitive settings (server address, branch, remembered email).
  shared_preferences: ^2.2.0

  # Access/refresh tokens go to the platform keystore, never to plain prefs.
  flutter_secure_storage: ^11.0.0

  # One state-management system across all four apps.
  flutter_riverpod: ^2.6.1

  # Local notifications only — there is no push service and no device-token
  # endpoint in the backend to register with, so nothing here can wake a killed
  # app. Said plainly rather than shipping something that looks like push and
  # silently is not. Already a direct dependency of rms_waiter at this version;
  # promoted here so the driver and customer apps share one implementation.
  flutter_local_notifications: ^22.3.0

  # The backend's realtime transport is a Socket.IO gateway, not a bare
  # websocket — see ARCHITECTURE.md §4. Speaking it by hand would mean
  # reimplementing Engine.IO's handshake and packet framing.
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
