name: rms_driver
description: "MetaXperts RMS — Driver app. Pick up, navigate, share location, deliver with OTP."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared foundation for all four RMS apps: API client with token refresh,
  # session, money, theme, domain models, the sign-in journey. See
  # packages/rms_core.
  rms_core:
    path: ../packages/rms_core

  http: ^1.2.0
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^11.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  cupertino_icons: ^1.0.6

  # Real device location. The app it replaces posted a hardcoded walk around
  # F-7 Markaz as if it were the rider's position — a customer watching that
  # map is being lied to about where their food is.
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
