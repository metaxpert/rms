# The gate that used to be a habit.
#
# Every phase of this repo was validated by running `flutter analyze` and
# `flutter test` by hand in five packages. That works right up until someone
# forgets, and the checks worth the most are the ones nobody thinks to run: the
# i18n parity test that catches a screen going half-Urdu mid-sentence, and the
# orphaned-key scan that protects a translator's time. Those only protect the
# repo if something runs them without being asked.
#
# scripts/check.sh runs these same steps on a laptop. Change one, change both.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push mid-run should cancel the run it obsoleted, but never on main —
# there, every commit's result is a record worth having.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. Flutter's analyzer gains lints between releases, so
  # `stable` means the gate can fail on a morning when nobody changed anything.
  # Bump this on purpose, in its own commit, with the fallout fixed in that commit.
  FLUTTER_VERSION: 3.44.9

jobs:
  # rms_core is a path dependency of all four apps, so it is its own job and the
  # apps wait on it: when the shared package breaks, one red job says so instead
  # of five saying it at once.
  core:
    name: rms_core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/rms_core
      - run: flutter analyze
        working-directory: packages/rms_core
      - run: flutter test
        working-directory: packages/rms_core

  apps:
    name: ${{ matrix.app }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One app's failure should not hide the other three's results.
      fail-fast: false
      matrix:
        app: [rms_waiter, rms_manager, rms_driver, rms_customer]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: ${{ matrix.app }}
      - run: flutter analyze
        working-directory: ${{ matrix.app }}
      - run: flutter test
        working-directory: ${{ matrix.app }}

  # The generated localisations are committed to git and also regenerated by
  # every build. So an .arb file edited without regenerating leaves a stale
  # generated file in the repository that is invisible to the person who did it
  # — their next build rewrites it locally — and shows up as an unrelated diff
  # in someone else's pull request. Regenerate everything; insist git sees nothing.
  l10n-drift:
    name: l10n is generated from its .arb files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Regenerate every catalogue
        run: |
          for pkg in packages/rms_core rms_waiter rms_manager rms_driver rms_customer; do
            ( cd "$pkg" && flutter pub get --enforce-lockfile && flutter gen-l10n )
          done
      - name: Nothing should have changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated localisations are stale. Run scripts/check.sh and commit the regenerated lib/src/l10n."
            git diff --stat
            git diff
            exit 1
          fi
          echo "Every generated catalogue matches its .arb files."

  # The four apps are demonstrated in a browser, and `flutter test` never
  # compiles for the web — dart2js rejects things the VM accepts. Kept separate
  # from the test jobs because it is the slow half and a red build here means
  # something different from a red test.
  build-web:
    name: ${{ matrix.app }} · release web build
    needs: [core, apps]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [rms_waiter, rms_manager, rms_driver, rms_customer]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: ${{ matrix.app }}
      - run: flutter build web --release
        working-directory: ${{ matrix.app }}

  # A single required check to protect the branch with, so adding an app to the
  # matrix later does not mean editing branch-protection settings to match.
  gate:
    name: gate
    if: always()
    needs: [core, apps, l10n-drift, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed ($r)"; exit 1; }
          done
          echo "green"
